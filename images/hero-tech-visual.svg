<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="terminalBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="windowDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient glowing tech mesh -->
  <circle cx="320" cy="220" r="190" fill="#3B82F6" opacity="0.12"/>
  <circle cx="480" cy="120" r="110" fill="#06B6D4" opacity="0.14"/>
  <circle cx="140" cy="340" r="90" fill="#8B5CF6" opacity="0.10"/>

  <!-- Main IDE / Terminal Window -->
  <g filter="url(#windowDrop)">
    <rect x="50" y="40" width="540" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Title bar -->
    <path d="M50 56 C50 47.16 57.16 40 66 40 L574 40 C582.84 40 590 47.16 590 56 L590 82 L50 82 Z" fill="url(#terminalBar)"/>
    <circle cx="76" cy="61" r="5.5" fill="#EF4444"/>
    <circle cx="96" cy="61" r="5.5" fill="#F59E0B"/>
    <circle cx="116" cy="61" r="5.5" fill="#10B981"/>
    <text x="320" y="66" font-family="'Segoe UI', monospace" font-size="12" fill="#94A3B8" text-anchor="middle">jecrc_cse_core.cpp — [JECRC Supercomputing Cluster]</text>

    <!-- Code Display -->
    <g transform="translate(80, 115)" font-family="'Consolas', 'Courier New', monospace" font-size="13.5">
      <text x="0" y="0" fill="#64748B">01  <tspan fill="#F43F5E">#include</tspan> <tspan fill="#38BDF8">&lt;jecrc/ai_quantum.hpp&gt;</tspan></text>
      <text x="0" y="24" fill="#64748B">02  <tspan fill="#F43F5E">#include</tspan> <tspan fill="#38BDF8">&lt;jecrc/cloud_distributed.hpp&gt;</tspan></text>
      <text x="0" y="48" fill="#64748B">03  </text>
      <text x="0" y="72" fill="#64748B">04  <tspan fill="#3B82F6">namespace</tspan> <tspan fill="#FCD34D">JecrcCSE</tspan> {</text>
      <text x="0" y="96" fill="#64748B">05    <tspan fill="#3B82F6">class</tspan> <tspan fill="#FCD34D">FutureEngineer</tspan> {</text>
      <text x="0" y="120" fill="#64748B">06      <tspan fill="#3B82F6">public</tspan>:</text>
      <text x="0" y="144" fill="#64748B">07        <tspan fill="#10B981">void</tspan> <tspan fill="#67E8F9">innovateToday</tspan>() {</text>
      <text x="0" y="168" fill="#64748B">08          <tspan fill="#E2E8F0">std::cout &lt;&lt; </tspan><tspan fill="#34D399">"Engineering Tomorrow!
"</tspan>;</text>
      <text x="0" y="192" fill="#64748B">09          <tspan fill="#93C5FD">deployToCloud</tspan>(<tspan fill="#F59E0B">"Excellence"</tspan>);</text>
      <text x="0" y="216" fill="#64748B">10        }</text>
      <text x="0" y="240" fill="#64748B">11    };</text>
      <text x="0" y="264" fill="#64748B">12  }</text>
    </g>
  </g>

  <!-- Floating Badge 1: High Tech Computing Badge -->
  <g transform="translate(420, 310)" filter="url(#windowDrop)">
    <rect width="190" height="85" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" fill-opacity="0.96"/>
    <circle cx="36" cy="42" r="18" fill="#0284C7" fill-opacity="0.2"/>
    <path d="M28 42 L34 48 L44 36" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="37" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">NVIDIA AI Lab</text>
    <text x="64" y="55" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">High Performance Cluster</text>
  </g>

  <!-- Floating Badge 2: Coding & Research Badge -->
  <g transform="translate(25, 300)" filter="url(#windowDrop)">
    <rect width="180" height="80" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5" fill-opacity="0.96"/>
    <circle cx="34" cy="40" r="18" fill="#10B981" fill-opacity="0.2"/>
    <path d="M29 34 L23 40 L29 46 M39 34 L45 40 L39 46" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="36" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Coding Culture</text>
    <text x="62" y="54" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Active Hackathon Teams</text>
  </g>
</svg>