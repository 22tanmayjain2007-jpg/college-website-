  <text x="300" y="295" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Industry jury evaluating production-ready student software engineering projects</text>
  <text x="300" y="345" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#0284C7" text-anchor="middle">CLICK TO VIEW FULL DETAILS</text>
