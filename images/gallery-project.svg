    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
  </g>
  <!-- Category Badge -->
  <rect x="230" y="70" width="140" height="28" rx="14" fill="#0284C7" fill-opacity="0.25" stroke="#0284C7" stroke-width="1"/>
  <text x="300" y="89" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Student Projects</text>
