<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 75" width="280" height="75">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Emblem Shield -->
  <g transform="translate(6, 7)" filter="url(#logoShadow)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#logoGrad)"/>
    <!-- Computing tech icon inside shield -->
    <path d="M18 20 L30 13 L42 20 L42 36 L30 48 L18 36 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="30" cy="29" r="5" fill="#38BDF8"/>
    <path d="M30 13 L30 24 M42 36 L34 31 M18 36 L26 31" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="20" r="2.5" fill="#FBBF24"/>
    <circle cx="42" cy="20" r="2.5" fill="#FBBF24"/>
    <circle cx="30" cy="48" r="3" fill="#F59E0B"/>
  </g>
  <!-- Institution Identity Typography -->
  <g transform="translate(78, 22)">
    <text x="0" y="12" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="16" font-weight="900" fill="#0F172A" letter-spacing="0.5">JECRC</text>
    <text x="56" y="12" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1D4ED8">INSTITUTE</text>
    <text x="0" y="27" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">OF TECHNOLOGY</text>
    <text x="0" y="41" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0D9488" letter-spacing="0.4">DEPT. OF COMPUTER SCIENCE &amp; ENGG.</text>
  </g>
</svg>